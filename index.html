<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#0b0e13">
<meta name="format-detection" content="telephone=no">
<title>Персональная тренировка</title>
<style>
:root{
  --bg:#0b0e13;--card:#151a21;--card2:#1b212a;--line:#2a313c;--text:#e8edf2;--muted:#8d97a5;
  --red:#ff5b4f;--orange:#ff9a3c;--accent:#3b82f6;--ok:#34c759;--pink:#f472b6;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(70px + var(--sb))}
body.tm{padding-bottom:calc(210px + var(--sb))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:16px}
input[type=date]{min-height:44px}
h1,h2,h3{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* шапка */
.top{position:sticky;top:0;z-index:20;background:rgba(11,14,19,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:var(--st);border-bottom:1px solid #161b22}
.hdr{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.hdr h1{flex:1;font-size:19px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{min-width:46px;height:46px;border:1.5px solid #3a424e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;padding:0 10px}
.ibtn svg{width:20px;height:20px;fill:currentColor}
.wk{display:flex;align-items:center;gap:8px;padding:0 0 10px}
.wk .arr{width:38px;height:38px;border-radius:10px;background:var(--card2);font-size:20px;line-height:1}
.wk .arr:disabled{opacity:.3}
.wk .mid{flex:1;text-align:center;font-size:14px}
.wk .mid b{font-size:16px;display:block}
.wk .mid span{color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#2b2412;color:#ffc861;margin-left:4px}
.days{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 64px;min-width:64px;border:1.5px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;background:var(--card)}
.day b{display:block;font-size:19px;font-weight:600}
.day small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap}
.day.on{background:#f2f4f7;border-color:#f2f4f7;color:#111}
.day.on small{color:#555}
.day.today:not(.on){border-color:#4b5563}
.day .ck{color:var(--ok);font-size:12px}

/* карточки */
.sec{margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.sec h2{font-size:18px;flex:1}
.sec .m{color:var(--muted);font-size:14px;font-weight:400}
.sbtn{background:var(--accent);color:#fff;border-radius:11px;padding:9px 13px;font-weight:600;font-size:14.5px;white-space:nowrap}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;font-size:15px}
.note h3{font-size:17px;margin-bottom:6px}
.note p{margin:6px 0}
.note .mut{color:var(--muted)}
.note.warn{border-color:#5c4a1a;background:#1d1a10}
.circ{color:var(--muted);font-size:14.5px;margin:-2px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;display:grid;grid-template-columns:44% 1fr;gap:14px;scroll-margin-top:200px;transition:border-color .3s}
.card.cur{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.card.done{opacity:.72}
.fig{text-align:center}
.fig svg{width:100%;aspect-ratio:160/140;background:#0e1218;border-radius:12px;display:block}
.vbtn{display:block;margin-top:10px;padding:9px 6px;border-radius:11px;background:#2a1414;border:1px solid #5b2323;color:#ff8a80;font-weight:600;font-size:14px;text-decoration:none}
.vbtn:active{opacity:.7}
.vmore{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);text-decoration:underline}
.cap{font-weight:700;font-size:14.5px;margin-top:8px;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.info h3{font-size:19px;line-height:1.25;font-weight:700}
.spec{color:var(--red);font-weight:700;font-size:16px;margin:6px 0 8px}
.why{margin:0 0 6px;font-size:15px}
.info ol{margin:6px 0;padding-left:20px;font-size:15px}
.info ol li{margin:3px 0}
.info ol li::marker{color:var(--red);font-weight:700}
.tip{font-size:14.5px;color:var(--muted);margin:6px 0 0}
.tip b{color:var(--text)}
.lv{grid-column:1/-1;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14.5px}
.lv .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lv .row span{color:var(--muted);margin-right:2px}
.lc{width:34px;height:32px;border-radius:9px;border:1.5px solid var(--line);font-weight:600;position:relative}
.lc.on{background:var(--orange);border-color:var(--orange);color:#111}
.lc.rec::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lv .alt{margin-top:6px;color:#cdd5df;border-left:3px solid var(--pink);padding-left:8px}
.lv .alt b{color:var(--pink)}
.lv .hint{color:var(--muted);font-size:13px;margin-top:6px}
.foot{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);font-size:13px;color:var(--muted)}
.dot.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.abtn{border-radius:11px;padding:9px 14px;font-weight:600;font-size:15px;background:var(--card2);border:1px solid var(--line)}
.abtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.abtn.ok{background:#12301c;border-color:#1f5c33;color:#7ee2a1}

/* нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,19,25,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sb)}
.nav button{flex:1;padding:8px 0 7px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--text)}

/* таймер */
.timer{position:fixed;left:8px;right:8px;bottom:calc(66px + var(--sb));z-index:40;background:#1d2430;border:1px solid #39465a;border-radius:18px;padding:12px 14px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer.show{display:block}
.timer .tl{display:flex;align-items:center;gap:10px}
.timer .nm{flex:1;min-width:0}
.timer .nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .nm span{font-size:13px;color:var(--muted)}
.timer .tt{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.timer.rest .tt{color:#7cc4ff}
.timer.work .tt{color:var(--orange)}
.timer .bar{height:5px;background:#2b3442;border-radius:3px;margin:9px 0 9px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--orange);width:0}
.timer.rest .bar i{background:#7cc4ff}
.timer .ctr{display:flex;gap:8px}
.timer .ctr button{flex:1;background:#2a3342;border-radius:10px;padding:9px 0;font-weight:600;font-size:14.5px}

/* формы, таблицы */
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.big{font-size:30px;font-weight:700}
.prog{height:10px;background:#252c37;border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#34c759)}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qa button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.chart svg{width:100%;display:block}
.pill{display:inline-block;background:var(--card2);border-radius:8px;padding:2px 8px;margin:2px 2px 2px 0;font-size:13.5px}
ul.l{padding-left:20px;margin:6px 0}
ul.l li{margin:4px 0}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none!important}

@media (max-width:370px){
  .card{grid-template-columns:42% 1fr;gap:10px;padding:12px}
  .info h3{font-size:17px}
  .spec{font-size:15px}
}
</style>
</head>
<body>

<div class="top" id="top">
  <div class="wrap">
    <div class="hdr">
      <h1 id="title">Персональная тренировка</h1>
      <button class="ibtn" id="speedBtn" aria-label="Скорость анимации">1×</button>
      <button class="ibtn" id="pauseBtn" aria-label="Пауза анимации"><svg viewBox="0 0 20 20" id="pauseIco"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
    </div>
    <div id="wkbar"></div>
  </div>
</div>

<main class="wrap" id="main"></main>

<div class="timer" id="timer">
  <div class="tl"><div class="nm"><b id="tName">—</b><span id="tNext"></span></div><div class="tt" id="tTime">0:00</div></div>
  <div class="bar"><i id="tBar"></i></div>
  <div class="ctr"><button id="tPause">Пауза</button><button id="tSkip">Дальше</button><button id="tStop">Стоп</button></div>
</div>

<nav class="nav" id="nav">
  <button data-v="w" class="on"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Тренировка</button>
  <button data-v="p"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Прогресс</button>
  <button data-v="f"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-2 6 0 8v10"/></svg>Питание</button>
  <button data-v="i"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>План</button>
</nav>

<input type="file" id="fileIn" accept="application/json,.json" class="hidden">

 step_jack:{n:'Шаг в сторону с руками вверх',cap:'«Джампинг-джек» без прыжка',sub:'по очереди в каждую сторону',why:'Кардио без ударной нагрузки.',st:['Шагни в сторону и подними руки над головой.','Вернись, опуская руки.','Смени ногу.'],tip:['Темп:','как можно быстрее, без подскока.']},
 knee_elbow:{n:'Колено к локтю стоя',cap:'Скручивание стоя',sub:'по очереди',why:'Пресс и косые мышцы, плюс пульс.',st:['Руки за головой, локти в стороны.','Подними колено и потянись к нему противоположным локтем.','Смени сторону.'],tip:['Спина:','не сутулься, скручивайся корпусом.']},
 stretch_hf:{n:'Растяжка передней поверхности бедра',cap:'Выпад с коленом на полу',sub:'таз вперёд',why:'Расслабляет сгибатели бедра — уменьшает прогиб в пояснице и «выпирающий» живот.',side:1,st:['Встань в выпад, заднее колено на полу (подложи полотенце).','Подай таз вперёд, пока не почувствуешь растяжение спереди бедра.','Держи, дыши ровно.'],tip:['Поясница:','не прогибай, подкрути таз под себя.']},
 quad_lunge:{n:'Выпад с захватом стопы',cap:'Пятка к ягодице',sub:'колено на полу',why:'Глубоко растягивает переднюю поверхность бедра — путь к шпагату.',side:1,st:['Из выпада с коленом на полу согни заднюю ногу.','Возьми стопу рукой и тяни пятку к ягодице.','Таз подавай вперёд.'],tip:['Опора:','держись рукой за стул, если неустойчиво.']},
 stretch_ham:{n:'Задняя поверхность бедра с резинкой',cap:'Нога вверх с резинкой',sub:'колено прямое',why:'Улучшает растяжку и снимает напряжение с поясницы.',side:1,st:['Лёжа на спине, накинь резинку на стопу.','Подними прямую ногу и тяни к себе до растяжения.','С фазы 2: 5 с дави ногой в резинку, расслабься и потяни глубже. 3 раза.'],tip:['Метод:','«напряжение — расслабление» даёт самый быстрый рост гибкости.']},
 fig4:{n:'Растяжка ягодиц лёжа («фигура 4»)',cap:'Щиколотка на колено',sub:'тяни бедро к груди',why:'Расслабляет ягодицы и таз, снимает напряжение с поясницы.',side:1,st:['Лёжа на спине, положи щиколотку на колено другой ноги.','Обхвати бедро опорной ноги и тяни к груди.','Держи, расслабив плечи.'],tip:['Сильнее:','с фазы 3 можно делать позу голубя.']},
 child:{n:'Поза ребёнка',cap:'Поза ребёнка',sub:'руки вперёд',why:'Расслабляет спину и плечи.',st:['Сядь на пятки, колени врозь.','Наклонись вперёд, руки вытяни по полу.','Дыши в спину.'],tip:['Лоб:','на полу, шея расслаблена.']},
 cobra_child:{n:'Кобра → поза ребёнка',cap:'Прогиб и отдых',sub:'плавный переход',why:'Растягивает живот и грудь, затем расслабляет спину.',st:['Лёжа на животе, ладони под плечами — мягко поднимись в кобру.','Задержись, плечи от ушей.','Перейди назад в позу ребёнка. Чередуй.'],tip:['Поясница:','без боли. Прогиб только до комфорта.']},
 stretch_chest:{n:'Растяжка груди в дверном проёме',cap:'Предплечье на косяке',sub:'шаг вперёд',why:'Раскрывает грудь и плечи — убирает сутулость.',side:1,st:['Поставь предплечье на дверной косяк, локоть на уровне плеча.','Сделай небольшой шаг вперёд до растяжения в груди.','Держи, плечо опущено.'],tip:['Плечо:','не поднимай к уху.']},
 thread:{n:'«Нить в иголку»',cap:'Скрутка на четвереньках',sub:'рука вверх → под корпус',why:'Возвращает подвижность грудному отделу — основа ровной осанки.',side:1,st:['На четвереньках подними руку вверх, раскрывая грудь.','Затем протяни её под корпусом в другую сторону, опуская плечо.','Задержись внизу, вернись.'],tip:['Таз:','остаётся на месте, крутится только грудной отдел.']},
 stretch_lat:{n:'Растяжка широчайших у дивана',cap:'Грудь вниз',sub:'руки на диване',why:'Растягивает спину и плечи, помогает поднимать руки без прогиба.',st:['Встань на колени перед диваном, ладони на нём.','Отведи таз назад и опусти грудь к полу.','Держи, дыши.'],tip:['Шея:','голова между рук, расслаблена.']},
 chin_tuck:{n:'Подбородок назад',cap:'«Двойной подбородок»',sub:'затылок тянется вверх',why:'Возвращает голову над плечами — главное упражнение против «шеи вперёд».',st:['Сядь или встань у стены, смотри прямо.','Плавно отведи подбородок назад, не опуская голову.','Задержи 5 с, расслабься.'],tip:['Ощущение:','тянется задняя поверхность шеи.']},
 neck_tilt:{n:'Наклон головы к плечу',cap:'Ухо к плечу',sub:'противоположное плечо вниз',why:'Снимает напряжение в шейно-воротниковой зоне.',side:1,st:['Сядь прямо, опусти плечи.','Наклони голову ухом к плечу.','Противоположную руку тяни вниз к полу.'],tip:['Мягко:','без рывков и боли.']},
 neck_down:{n:'Растяжка задней поверхности шеи',cap:'Подбородок к груди',sub:'руки на затылке без нажима',why:'Расслабляет мышцы задней поверхности шеи и верх спины.',st:['Сядь прямо.','Опусти подбородок к груди.','Можно положить руки на затылок — только их вес, без нажима.'],tip:['Плечи:','опущены и расслаблены.']},
 wall_angel:{n:'«Ангел у стены»',cap:'Руки по стене',sub:'из «W» в «Y»',why:'Включает мышцы между лопатками и раскрывает плечи.',st:['Встань спиной к стене: затылок, лопатки и таз касаются её.','Руки в форме буквы «W», локти у стены.','Медленно скользи руками вверх в «Y» и обратно.'],tip:['Поясница:','не отрывай от стены, рёбра опусти.']},
 breath:{n:'Дыхание животом',cap:'Дыхание',sub:'руки на животе',why:'Расслабляет шею и плечи, учит дышать животом, а не плечами.',st:['Лёжа на спине, колени согнуты, ладони на животе.','Вдох носом 4 с — живот поднимается.','Выдох ртом 6 с — живот опускается.'],tip:['Плечи:','неподвижны, дышит только живот.']},
 row_db:{n:'Тяга гантелей в наклоне',cap:'Тяга к поясу',sub:'лопатки сводятся',why:'Укрепляет спину и выпрямляет осанку.',st:['Наклонись с прямой спиной, колени чуть согнуты, гантели свисают.','Тяни гантели к поясу, сводя лопатки.','Медленно опусти.'],tip:['Локти:','идут вдоль корпуса, плечи не поднимаются.'],
  lv:[['Две гантели по 3 кг.'],['Пауза 2 с вверху, опускание 3 с.'],['Одной рукой с обеими гантелями (6 кг), второй рукой опора на стул.','Не держатся две гантели в руке — одна гантель + утяжелитель на запястье (4 кг).'],['Одной рукой 6 кг + сильная резинка под стопой.'],['Одной рукой, полуторные повторы.']]},
 row_band:{n:'Тяга резинки к поясу сидя',cap:'Тяга сидя',sub:'резинка за стопами',why:'Сильная спина и лопатки на месте — осанка ровнее.',st:['Сядь, ноги прямые, резинка вокруг стоп.','Тяни концы к поясу, локти назад, лопатки вместе.','Медленно отпусти.'],tip:['Спина:','прямая, не отклоняйся назад.'],
  lv:[['Лёгкая резинка.'],['Сильная резинка.'],['Сильная + пауза 2 с у пояса.'],['Сильная, взять короче или сложить вдвое.','Или обе резинки вместе.']]},
 band_pull:{n:'Растягивание резинки вниз над головой',cap:'Тяга без крепления',sub:'локти к бокам',why:'Широчайшие и мышцы между лопатками — красивая спина, талия визуально уже. Резинку никуда крепить не нужно.',st:['Возьми резинку над головой, руки прямые, хват шире плеч.','Растягивая резинку, опусти локти вниз к бокам — резинка за головой или перед лицом.','Медленно верни руки вверх.'],tip:['Плечи:','опусти вниз, не поднимай к ушам.'],
  lv:[['Лёгкая резинка, хват широкий.'],['Хват уже — резинка тянется сильнее.'],['Сильная резинка.'],['Сильная + пауза 2 с внизу.'],['Сильная резинка, сложенная вдвое, или обе резинки вместе.']]},
 face_apart:{n:'Разведение резинки к лицу',cap:'Локти в стороны',sub:'руки «рогатка»',why:'Главное упражнение для осанки: задние дельты и мышцы между лопатками. Замена тяге к лицу — без крепления.',st:['Возьми резинку руками перед лицом, локти на уровне плеч.','Разведи руки в стороны и чуть назад: локти согнуты под 90°, кисти вверх, как «рогатка».','Задержись, медленно верни.'],tip:['Лопатки:','сведи и опусти вниз.'],
  lv:[['Лёгкая резинка.'],['Пауза 2 с в разведении.'],['Сильная резинка.','Или лёгкая, взятая короче.'],['Сильная + пауза 3 с.']]},
 pullapart:{n:'Разведение резинки перед грудью',cap:'Разведение',sub:'руки прямые',why:'Включает мышцы между лопатками, раскрывает грудь.',st:['Возьми резинку перед грудью, руки прямые.','Разведи руки в стороны до касания резинкой груди.','Медленно верни.'],tip:['Плечи:','опущены, не к ушам.']},
 pushup:{n:'Отжимания от опоры',cap:'От дивана',sub:'тело прямое',why:'Грудь, руки и пресс одновременно.',st:['Ладони на опоре чуть шире плеч, тело прямое.','Опустись грудью к опоре, локти под 45° к корпусу.','Оттолкнись, не прогибаясь.'],tip:['Опора:','чем ниже, тем тяжелее. Уровни ниже.'],
  lv:[['От стены.'],['От стола.'],['От дивана или с колен на полу.'],['С колен, грудь до пола, опускание 3 с.'],['Классические, опускание 3–4 с.']]},
 press:{n:'Жим гантелей вверх',cap:'Жим над головой',sub:'сидя или стоя',why:'Сильные плечи и руки, ровная верхняя часть спины.',st:['Гантели у плеч, локти под кистями.','Выжми вверх над головой.','Медленно опусти к плечам.'],tip:['Рёбра:','опусти, не прогибайся в пояснице.'],
  lv:[['Гантели 2 × 3 кг.'],['Опускание 3 с.'],['+ утяжелители на запястья — по 4 кг.','Или сильная резинка под стопами, концы вместе с гантелями.'],['Стоя, по одной руке, пауза наверху.']]},
 latraise:{n:'Подъём гантелей в стороны',cap:'Руки в стороны',sub:'до уровня плеч',why:'Укрепляет плечи и снимает зажим шеи (по исследованию Andersen).',st:['Гантели вдоль корпуса, локти чуть согнуты.','Подними руки в стороны до уровня плеч.','Медленно опусти.'],tip:['Шея:','плечи не поднимай к ушам.'],
  lv:[['Утяжелители 1 кг в руках или без веса.'],['Гантели 3 кг.'],['Гантели + пауза 2 с наверху.'],['Гантели + утяжелители на запястьях (4 кг).','Или лёгкая резинка под стопами вместе с гантелями.']]},
 shrug:{n:'Подъём плеч с гантелями',cap:'Плечи вверх',sub:'и мягко вниз',why:'Укрепление трапеций снимает хроническое напряжение в шее.',st:['Гантели в опущенных руках.','Подними плечи к ушам.','Задержись 1 с и медленно опусти.'],tip:['Голова:','прямо, не кивай.'],
  lv:[['Гантели 2 × 3 кг.'],['Пауза 2 с наверху.'],['+ утяжелители на запястья (4 кг в руке).'],['Обе гантели в одной руке, по очереди (6 кг).','Или сильная резинка под стопами.']]},
 curl:{n:'Сгибания на бицепс',cap:'Бицепс',sub:'локти прижаты',why:'Подтянутые руки спереди.',st:['Гантели в руках, локти прижаты к бокам.','Согни руки, поднимая гантели к плечам.','Медленно опусти.'],tip:['Корпус:','не раскачивайся.'],
  lv:[['Гантели 3 кг.'],['Опускание 3 с.'],['+ утяжелители на запястья.','Или резинка под стопами.'],['Полуторные повторы.']]},
 triext:{n:'Разгибания на трицепс из-за головы',cap:'Трицепс',sub:'локти смотрят вверх',why:'Убирает «дряблость» на задней стороне рук.',st:['Подними гантели над головой.','Согни руки, опуская гантели за голову.','Выпрями руки вверх.'],tip:['Локти:','не разводи в стороны.'],
  lv:[['Одна гантель двумя руками.'],['Опускание 3 с.'],['Две гантели, по одной в руке + утяжелители на запястьях.'],['По одной руке, медленно.']]},
 ytw:{n:'Буквы Y-T-W лёжа',cap:'Y → T → W',sub:'руки над полом',why:'Мышцы между лопатками — прямая спина и раскрытые плечи.',st:['Ляг на живот, лоб над полом.','Подними руки буквой Y, затем T (в стороны), затем W (локти к бокам).','Каждую букву держи 2 с.'],tip:['Шея:','взгляд в пол, не задирай голову.'],
  lv:[['Без веса.'],['Утяжелители 1 кг в руках.'],['Утяжелители + пауза 3 с в каждой букве.']]},
 swimmer:{n:'«Пловец» лёжа',cap:'Рука и нога вверх',sub:'по очереди',why:'Мышцы спины по всей длине — основа осанки.',st:['Лёжа на животе, руки вперёд.','Подними правую руку и левую ногу.','Опусти и смени стороны.'],tip:['Таз:','прижат к полу.']},
 jabcross:{n:'Прямые удары: джеб-кросс',cap:'Прямой-прямой',sub:'руки в защите',why:'Кардио, руки и плечи без прыжков.',st:['Встань в стойку: одна нога впереди, руки у подбородка.','Ударь передней рукой вперёд, затем задней с поворотом корпуса.','Сразу возвращай руки в защиту.'],tip:['С фазы 3:','утяжелители 1 кг на запястьях.']},
 shadow:{an:'jabcross',n:'Свободный бой с тенью',cap:'Свободные комбинации',sub:'на скорость',why:'Финальный рывок: максимум энергии без прыжков.',st:['Комбинируй любые удары: прямые, боковые, снизу, коленом.','Двигайся в стойке, не замирай.','Держи темп, дыши.'],tip:['Утяжелители:','на запястьях, если плечи справляются.']},
 hook:{n:'Боковые удары (хук)',cap:'Хук',sub:'локоть на уровне плеча',why:'Косые мышцы живота, плечи и пульс.',st:['Стойка, руки в защите.','Ударь рукой сбоку по дуге, локоть на уровне плеча, корпус поворачивается.','Смени руку.'],tip:['Сила:','из поворота корпуса и стопы, а не только руки.']},
 upper:{n:'Удары снизу (апперкот)',cap:'Апперкот',sub:'кулак снизу вверх',why:'Руки, пресс и ноги в одном движении.',st:['Стойка, колени чуть согнуты.','Ударь снизу вверх, подталкивая движение ногами и корпусом.','Смени руку.'],tip:['Локоть:','согнут, не выпрямляй руку.']},
 slip:{n:'Джеб-кросс + присед с уклоном',cap:'Удары и присед',sub:'2 удара → присед',why:'Ноги и кардио одновременно.',st:['Два прямых удара.','Присядь, будто уходишь от удара, руки в защите.','Встань и повтори.'],tip:['Спина:','прямая в приседе.']},
 knee_strike:{n:'Удары коленом',cap:'Колено вверх',sub:'руки тянутся вниз',why:'Пресс и пульс без прыжков.',st:['Руки вытяни вперёд-вверх.','Резко подними колено, одновременно опуская руки к нему.','Смени ногу.'],tip:['Корпус:','чуть наклоняется к колену, спина ровная.']},
 kick_front:{n:'Удар ногой вперёд',cap:'Прямой удар',sub:'медленно, с контролем',why:'Ягодицы, бёдра и пресс, активная гибкость.',st:['Стойка, руки в защите.','Подними колено, затем выпрями ногу вперёд, носок на себя.','Согни колено и поставь ногу. Смени ногу.'],tip:['Высота:','не форсируй, бей на ту высоту, где держишь ногу ровно.']},
 kick_side:{n:'Удар ногой в сторону',cap:'Боковой удар',sub:'рука на стене',why:'Средняя ягодичная и баланс.',st:['Встань боком к стене, рука на ней.','Подними колено и выпрями ногу в сторону, удар пяткой.','Медленно верни. Половина времени — одна нога, половина — другая.'],tip:['Корпус:','наклоняется к стене, носок ударной ноги смотрит вперёд.']},
 plie:{n:'Плие с пульсацией',cap:'Плие',sub:'внизу пружинь',why:'Внутренняя поверхность бедра и ягодицы.',st:['Ноги широко, носки врозь, руки в стороны.','Опустись, колени над носками.','Внизу делай маленькие пружинящие движения.'],tip:['Спина:','вертикальная, таз не уходит назад.']},
 plie_calf:{n:'Плие с подъёмом пяток',cap:'Плие на носках',sub:'держи низ',why:'Икры, бёдра и ягодицы — стройные ноги.',st:['Опустись в плие и оставайся внизу.','Поднимай и опускай пятки.','Колени держи разведёнными.'],tip:['Баланс:','держись за спинку стула, если надо.']},

  if(it.k==='t'){let sets=ph===1?2:3;if(dl)sets=Math.max(2,sets-1);const t=it.t[ph-1];return {sets,secs:t,txt:`${sets} × ${t} с${sides}`,sub:'отдых 40 с',rest:40};}

  if(it.k==='c'){const c=sec.circ;return {txt:`${phaseVal(c.w,ph)} с работа / ${phaseVal(c.s,ph)} с отдых`};}

}
function hold(it,ph,sec){return it.s||(sec&&sec.deep?PH[ph].hold:45);}
function passes(it,ph,sec){if(it.n)return it.n;if(sec&&sec.deep)return PH[ph].hold<=45?2:1;return 1;}
function holdTxt(it,ph,sec){const s=hold(it,ph,sec),p=passes(it,ph,sec);return `${p>1?p+' × ':''}${s} с${it.side?' на сторону':''}`;}
function circInfo(sec,ph,dl){const c=sec.circ;let r=phaseVal(c.r,ph);if(dl)r=Math.max(1,r-1);return {r,w:phaseVal(c.w,ph),s:phaseVal(c.s,ph),between:c.between};}
function secVisible(sec,ph){return !sec.ph||sec.ph.includes(ph);}

function seqSteps(sec,ph,dl){
  const st=[];
  if(sec.circ){const c=circInfo(sec,ph,dl);for(let r=1;r<=c.r;r++){sec.it.forEach((it,i)=>{st.push({n:EX[it.x].n,s:c.w,work:1,i,lab:`Круг ${r} из ${c.r}`});st.push({n:'Отдых',s:c.s,i,lab:''});});if(r<c.r&&c.between>c.s){st[st.length-1].s=c.between;st[st.length-1].n='Отдых между кругами';}}st.pop();return st;}
  sec.it.forEach((it,i)=>{
    const ex=EX[it.x];
    if(it.k==='h'){const s=hold(it,ph,sec),p=passes(it,ph,sec);for(let k=0;k<p;k++){if(it.side){st.push({n:ex.n+' — правая',s,work:1,i});st.push({n:'Смена стороны',s:5,i});st.push({n:ex.n+' — левая',s,work:1,i});}else st.push({n:ex.n,s,work:1,i});st.push({n:'Переход',s:8,i});}}
    else if(it.k==='b'){const t=it.t[ph-1];if(it.side){st.push({n:ex.n+' — правая',s:t,work:1,i});st.push({n:'Смена ноги',s:8,i});st.push({n:ex.n+' — левая',s:t,work:1,i});}else st.push({n:ex.n,s:t,work:1,i});st.push({n:'Отдых',s:15,i});}
    else{st.push({n:ex.n,s:it.s||60,work:1,i});st.push({n:'Переход',s:8,i});}

  st.pop();return st;
}
function dayMinutes(day,ph,dl){
  let s=0;day.sec.forEach(sec=>{if(!secVisible(sec,ph)||(sec===NECK&&!day.rest))return;
    if(sec.seq||sec.circ){seqSteps(sec,ph,dl).forEach(x=>s+=x.s);return;}
    sec.it.forEach(it=>{const sp=specOf(it,ph,dl,sec);if(it.k==='s'){const uni=EX[it.x].per&&!it.reps?2:1;s+=sp.sets*(40*uni+(it.ss?0:sp.rest));}else if(it.k==='t')s+=sp.sets*((sp.secs*(it.side?2:1))+40);});
  });
  return Math.max(5,Math.round(s/60/5)*5);
}

const goalW=()=>S.goal||null;const startW=()=>{const w=sortBy(S.wt);return w.length?w[0].v:null;};
const f1=v=>v.toFixed(1).replace('.',',');
function sortBy(a){return a.slice().sort((x,y)=>x.d<y.d?-1:1);}
function lastW(){const w=sortBy(S.wt);return w.length?w[w.length-1]:null;}
function forecast(){const w=sortBy(S.wt);const lw=lastW();if(!lw)return null;const GOAL=goalW();if(!GOAL)return null;if(lw.v<=GOAL)return 'достигнута 🎉';
  const t0=parseD(lw.d)-21*864e5;const pts=w.filter(x=>parseD(x.d)>=t0);let rate=0.35;
  if(pts.length>=3){const xs=pts.map(p=>(parseD(p.d)-parseD(pts[0].d))/864e5/7),ys=pts.map(p=>p.v);const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2;});if(de>0){const sl=-nu/de;if(sl>0.05)rate=sl;}}
  const wk=(lw.v-GOAL)/rate;const d=new Date(parseD(lw.d).getTime()+wk*7*864e5);return `≈ ${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})} (темп ${rate.toFixed(2).replace('.',',')} кг/нед)`;}
function chart(){
  const w=sortBy(S.wt);if(!w.length)return '';

  const GOAL=goalW()||w[0].v,SW=startW();
  const vmax=Math.max(GOAL,...w.map(x=>x.v))+1,vmin=Math.min(GOAL,...w.map(x=>x.v))-1;
  const W=340,H=190,pl=30,pr=8,pt=10,pb=22;
